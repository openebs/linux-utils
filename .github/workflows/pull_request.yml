name: ci

on:
  pull_request:
    branches:
      # on pull requests to develop and release branches
      - develop
      - 'v*'

jobs:
  linux-utils:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: linux-utils
          - image: alpine-sh
          - image: alpine-bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.13.1

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          file: ./dockerfiles/${{ matrix.image }}/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            openebs/${{ matrix.image }}:ci
